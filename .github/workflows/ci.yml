name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stackforge
          POSTGRES_PASSWORD: stackforge
          POSTGRES_DB: stackforge
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgresql+asyncpg://stackforge:stackforge@localhost:5432/stackforge
      DATABASE_URL_SYNC: postgresql://stackforge:stackforge@localhost:5432/stackforge
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      SECRET_KEY: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests -q
